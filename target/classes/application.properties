# ═══════════════════════════════════════════════════
# ms-especialidades · application.properties
# Puerto: 8081  |  BD: especialidades_db
# Crear la BD vacía en phpMyAdmin. Hibernate crea las tablas.
# ═══════════════════════════════════════════════════
server.port=8081
spring.application.name=ms-especialidades

spring.datasource.url=jdbc:mysql://localhost:3306/especialidades_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
